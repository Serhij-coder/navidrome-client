[package]
name = "feishin-native-spike"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
mpris-probe = ["dep:zbus", "dep:async-io"]

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", optional = true }
async-io = { version = "=2.6.0", optional = true }

[dependencies]
serde_json.workspace = true
tempfile.workspace = true
feishin-spike-model = { path = "../spike-model" }

[target.'cfg(windows)'.dependencies]
tokio = { version = "=1.48.0", default-features = false, features = ["rt", "time", "net", "io-util"] }
interprocess = { version = "=2.4.6", default-features = false }
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[lints]
workspace = true

[[test]]
name = "native"
path = "../../tests/native-spike/native.rs"

[[test]]
name = "analysis_session"
path = "../../tests/native-spike/analysis_session.rs"

[[bin]]
name = "p01-pipe-peer"
path = "../../tests/native-spike/windows_peer.rs"
test = false
bench = false

[[test]]
name = "windows_pipe"
path = "../../tests/native-spike/windows_pipe.rs"

[[test]]
name = "control_session"
path = "../../tests/native-spike/control_session.rs"

[[test]]
name = "mpris"
path = "../../tests/native-spike/mpris.rs"
required-features = ["mpris-probe"]
