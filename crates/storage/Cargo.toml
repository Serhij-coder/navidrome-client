[package]
name = "feishin-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
feishin-domain = { path = "../domain" }
serde.workspace = true
serde_json.workspace = true
url.workspace = true
sha2 = "=0.10.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["Window", "Storage"] }

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "profiles"
path = "../../tests/storage/profiles.rs"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen.workspace = true

[[example]]
name = "browser-storage-probe"
path = "../../tests/storage/browser_probe.rs"
crate-type = ["cdylib"]

[[test]]
name = "imports"
path = "../../tests/storage/imports.rs"

[[test]]
name = "journal"
path = "../../tests/storage/journal.rs"

[[test]]
name = "settings_migration"
path = "../../tests/storage/settings_migration.rs"

[[test]]
name = "settings_versions"
path = "../../tests/storage/settings_versions.rs"

[[test]]
name = "early_versions"
path = "../../tests/storage/early_versions.rs"

[[test]]
name = "state"
path = "../../tests/storage/state.rs"

[[test]]
name = "session"
path = "../../tests/storage/session.rs"

[[test]]
name = "native_worker"
path = "../../tests/storage/native_worker.rs"

[features]
linux-secret-service = ["dep:secret-service", "dep:zbus"]

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"], optional = true }
zbus = { version = "=5.19.0", optional = true }

[[test]]
name = "credentials"
path = "../../tests/storage/credentials.rs"

[[test]]
name = "linux_credentials"
path = "../../tests/storage/linux_credentials.rs"
required-features = ["linux-secret-service"]

[[test]]
name = "credential_executor"
path = "../../tests/storage/credential_executor.rs"

[[test]]
name = "credential_worker"
path = "../../tests/storage/credential_worker.rs"

[[test]]
name = "payloads"
path = "../../tests/storage/payloads.rs"

[[test]]
name = "playlist_backups"
path = "../../tests/storage/playlist_backups.rs"
