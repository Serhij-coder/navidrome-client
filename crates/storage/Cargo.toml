[package]
name = "feishin-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
feishin-domain = { path = "../domain" }
serde.workspace = true
serde_json.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["Window", "Storage"] }

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "profiles"
path = "../../tests/storage/profiles.rs"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen.workspace = true

[[example]]
name = "browser-storage-probe"
path = "../../tests/storage/browser_probe.rs"
crate-type = ["cdylib"]

[[test]]
name = "imports"
path = "../../tests/storage/imports.rs"

[[test]]
name = "journal"
path = "../../tests/storage/journal.rs"

[[test]]
name = "settings_migration"
path = "../../tests/storage/settings_migration.rs"

[[test]]
name = "settings_versions"
path = "../../tests/storage/settings_versions.rs"

[[test]]
name = "early_versions"
path = "../../tests/storage/early_versions.rs"

[[test]]
name = "state"
path = "../../tests/storage/state.rs"
